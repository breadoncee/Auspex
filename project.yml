name: Auspex
options:
  bundleIdPrefix: com.local.auspex
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    SWIFT_VERSION: "6.2"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Auspex:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Auspex
        CFBundleName: Auspex
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Personal use"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.auspex
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging/IOHID-Bridging.h
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: IOKit.framework
      - sdk: ServiceManagement.framework
